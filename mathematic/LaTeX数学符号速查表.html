<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数学写作 LaTeX 符号速查表</title>
<style>
:root{
  --bg:#f7f8fa; --card:#fff; --ink:#1f2430; --muted:#6b7280;
  --accent:#4f46e5; --line:#e5e7eb; --code-bg:#f6f7f9;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.6}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:13px 22px;
  display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.3px}
header .sub{color:var(--muted);font-size:13px}
#q{flex:1;min-width:170px;max-width:330px;padding:8px 12px;border:1px solid var(--line);
  border-radius:8px;font-size:14px;outline:none;background:#fff}
#q:focus{border-color:var(--accent)}
.btn{padding:8px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;
  cursor:pointer;font-size:13px;color:var(--ink)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.layout{display:flex;gap:24px;max-width:1500px;margin:0 auto;padding:20px 22px 60px}
nav{position:sticky;top:74px;align-self:flex-start;width:180px;flex:none;
  max-height:calc(100vh - 100px);overflow:auto;font-size:13.5px}
nav a{display:block;padding:5px 10px;color:var(--muted);text-decoration:none;
  border-left:2px solid transparent;border-radius:0 6px 6px 0}
nav a:hover{color:var(--accent);background:#eef2ff;border-left-color:var(--accent)}
main{flex:1;min-width:0}
section{margin-bottom:34px;scroll-margin-top:80px}
section h2{font-size:16.5px;margin:0 0 12px;padding-bottom:8px;border-bottom:2px solid var(--accent);
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
section h2 span{font-size:12px;color:var(--muted);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  display:flex;flex-direction:column;gap:6px;min-width:0}
.sym{font-size:18px;text-align:center;padding:6px 4px;min-height:46px;display:flex;
  align-items:center;justify-content:center;overflow-x:auto}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;
  background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;
  color:#b91c1c;cursor:pointer;white-space:pre-wrap;word-break:break-word}
.code:hover{border-color:var(--accent)}
.note{font-size:12.5px;color:var(--muted);line-height:1.45}
.demo{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.demo .rt{padding:6px 0 10px;overflow-x:auto;text-align:center}
.demo pre{margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;
  background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;
  overflow-x:auto;color:#1f2937;cursor:pointer}
.demo .note{margin-top:8px}
.hide{display:none}
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#111827;color:#fff;
  padding:8px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50}
#toast.on{opacity:1}
@media(max-width:900px){nav{display:none}}
@media print{
  header,nav,#toast{display:none!important}
  body{background:#fff}
  .layout{padding:0;max-width:none;display:block}
  .grid{grid-template-columns:repeat(2,1fr)}
  .item,.demo{break-inside:avoid}
}
</style>
<script>
window.MathJax={
  tex:{packages:{'[+]':['ams','mathtools','boldsymbol','cancel','empheq','braket','extpfeil','upgreek','color','textmacros','noundefined']},
       inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]']]},
  options:{skipHtmlTags:['script','noscript','style','textarea','pre','code']},
  svg:{fontCache:'global'},
  startup:{ready(){MathJax.startup.defaultReady();
    MathJax.startup.promise.then(function(){window.__ts=function(){return MathJax.typesetPromise();};
      if(window.__pending){window.__pending=false;window.__ts();}});}}
};
</script>

<header>
  <h1>数学写作 LaTeX 符号速查表</h1>
  <span class="sub">点击代码即复制</span>

  <button class="btn" id="pb">打印 / 存为 PDF</button>

<div class="layout">
  <nav id="toc"></nav>

function build(){
  const toc=document.getElementById('toc'), main=document.getElementById('content');
  S.forEach(function(sec){
    const a=document.createElement('a');
    a.href='#'+sec.id; a.textContent=sec.name; toc.appendChild(a);

    const s=document.createElement('section'); s.id=sec.id;
    const h=document.createElement('h2'); h.textContent=sec.name;
    if(sec.hint){const sp=document.createElement('span'); sp.textContent=sec.hint; h.appendChild(sp);}
    s.appendChild(h);

    const g=document.createElement('div'); g.className='grid';
    sec.items.forEach(function(it){
      if(it.o){
        const d=document.createElement('div'); d.className='demo';
        const t=document.createElement('div'); t.className='note'; t.textContent=it.n;
        const p=document.createElement('pre'); p.className='code'; p.textContent=it.c;
        d.appendChild(t); d.appendChild(p); s.appendChild(d);
      }else if(it.d){
        const d=document.createElement('div'); d.className='demo';
        const r=document.createElement('div'); r.className='rt'; r.textContent='$$'+it.t+'$$';
        const p=document.createElement('pre'); p.className='code'; p.textContent=it.c;
        const t=document.createElement('div'); t.className='note'; t.textContent=it.n;
        d.appendChild(r); d.appendChild(p); d.appendChild(t); s.appendChild(d);
      }else{
        const d=document.createElement('div'); d.className='item';
        const r=document.createElement('div'); r.className='sym'; r.textContent='$'+it.t+'$';
        const p=document.createElement('div'); p.className='code'; p.textContent=it.c;
        const t=document.createElement('div'); t.className='note'; t.textContent=it.n;
        d.appendChild(r); d.appendChild(p); d.appendChild(t); g.appendChild(d);
      }
    });
    if(g.children.length) s.appendChild(g);
    main.appendChild(s);
  });
}

build();
if(window.__ts){window.__ts();}else{window.__pending=true;}

document.getElementById('q').addEventListener('input',function(e){
  const v=e.target.value.trim().toLowerCase();
  document.querySelectorAll('section').forEach(function(sec){
    let vis=0;
    sec.querySelectorAll('.item,.demo').forEach(function(el){
      const hit=(!v)||el.textContent.toLowerCase().indexOf(v)>=0;
      el.classList.toggle('hide',!hit);
      if(hit) vis++;
    });
    sec.classList.toggle('hide',vis===0);
  });
});

let tt;
function toast(m){
  const el=document.getElementById('toast');
  el.textContent=m; el.classList.add('on');
  clearTimeout(tt); tt=setTimeout(function(){el.classList.remove('on');},1300);
}
document.addEventListener('click',function(e){
  const t=e.target.closest?e.target.closest('.code'):null;
  if(!t) return;
  const txt=t.textContent;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){toast('已复制');},function(){toast('复制失败，请手动选中');});
  }else{toast('请手动选中复制');}
});
document.getElementById('pb').addEventListener('click',function(){window.print();});
